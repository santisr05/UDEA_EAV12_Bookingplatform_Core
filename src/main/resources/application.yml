spring:
  application:
    name: bookingplatform-core
  datasource:
    # Aiven for MySQL exige SSL; MySQL 8 trae SSL habilitado por defecto
    # tambien en local, asi que useSSL=true funciona en ambos entornos.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bookingplatform}?useSSL=true&requireSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

supabase:
  url: ${SUPABASE_URL:}
  secret-key: ${SUPABASE_SECRET_KEY:}
  jwks-url: ${SUPABASE_JWKS_URL:${supabase.url}/auth/v1/.well-known/jwks.json}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  allowed-origins: ${ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] %-5level %logger{36} - %msg%n"
